name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: filing-research --corpus corpora/sec list
      - run: python -m unittest discover -s tests -q
      - run: python -m compileall -q -b filing_assistant tests
      - run: python -m pip wheel . --no-deps -w dist


  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t filing-research .
      - name: Serve and answer offline (extractive writer, no key)
        run: |
          docker run -d --name app -p 8765:8765 filing-research
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8765/api/config -o /dev/null && break; sleep 2; done
          curl -sf -X POST http://127.0.0.1:8765/api/answer -H 'Content-Type: application/json' \
            -d '{"question":"How many exchanges does Coinbase operate?","scope":{"company":"COIN","accessions":["0001679788-26-000015"]}}' | grep -q '"status"'
