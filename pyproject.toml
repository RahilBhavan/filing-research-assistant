[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
# Pyflakes (unused imports/names, undefined names) plus import and syntax errors.
# The code base uses a compact one-line style, so style rules (E7xx) are not enabled.
select = ["E4", "E9", "F"]
