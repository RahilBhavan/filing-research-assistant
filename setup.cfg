[metadata]
name = filing-research-assistant
version = 1.0.0
description = Local, source-linked research across selected SEC filings
long_description = file: README.md
long_description_content_type = text/markdown
license = All rights reserved
author = Rahil Bhavan
classifiers =
    Development Status :: 4 - Beta
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.12

[options]
packages = find:
python_requires = >=3.9
include_package_data = True

[options.package_data]
filing_assistant = static/*.html, static/*.css, static/*.js

[options.entry_points]
console_scripts =
    filing-research = filing_assistant.__main__:main

